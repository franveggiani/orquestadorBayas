version: '3.8'

services: 
  redis: 
    image: redis:alpine  # Versión más ligera
    container_name: redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3

  flower:
    image: mher/flower
    container_name: flower
    environment:
      - FLOWER_UNAUTHENTICATED_API=true
      - FLOWER_BROKER_URL=redis://redis:6379/0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports: ["5555:5555"]
    depends_on:
      redis:
        condition: service_healthy

  orquestador-fastapi:
    build: ./orquestador
    volumes:
      - ${SHARED_VOL}:/shared
      - ./orquestador:/app
    ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      detector-service:
        condition: service_healthy
      qrdetector-service:
        condition: service_started
      tracker-service:
        condition: service_started
      nubes-service:
        condition: service_started
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 4

  orquestador-celery:
    build: ./orquestador
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A api.celery_app worker --loglevel=info --concurrency=4 --hostname=orquestador@%h

  detector-service:
    build: ./workers/detectorBayasModern
    volumes:
      - ${SHARED_VOL}:/shared
      - ${DETECTOR_MODELS_DIR:-./workers/detectorBayasModern/models}:/models:ro
    gpus: all
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - NVIDIA_VISIBLE_DEVICES=all
      - MODEL_PATH=/models/2022.11.30_grapes_mix_iou.pth
      - DEVICE=cuda
      - CONFIDENCE_THRESHOLD=0.4
      - MAX_DETECTIONS=1000
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  qrdetector-service: 
    build: ./workers/qrDetectorBayas
    volumes: 
      - ./workers/qrDetectorBayas:/app
      - ${SHARED_VOL}:/shared
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports: ["8002:8002"]
    restart: unless-stopped

  tracker-service:
    build: ./workers/trackerBayas
    volumes:
      - ./workers/trackerBayas:/app
      - ${SHARED_VOL}:/shared
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports: ["8003:8003"]
    restart: unless-stopped

  nubes-service: 
    build: ./workers/nubesBayas
    volumes:
      - ./workers/nubesBayas:/app
      - ${SHARED_VOL}:/shared
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports: ["8004:8004"]
    restart: unless-stopped

volumes:
  redis_data: 
  shared_vol:  # Nombre consistente
